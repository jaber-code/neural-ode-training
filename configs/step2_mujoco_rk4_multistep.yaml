# Template for step 2: point `dataset.params.path` at a real downloaded
# offline-RL dump (D4RL/Minari-style .hdf5 or .npz) and set `dt` to that
# env's real control timestep (e.g. MuJoCo-Gym default is 0.008s = dt*frame_skip).
# No ground-truth dynamics exist for real data, so analytic_test_dts is left
# empty (the sweep eval auto-skips); the integration self-consistency check
# (convergence_*) still runs since it needs no ground truth.
name: step2_mujoco_rk4_multistep
seed: 0
device: cpu

dataset:
  name: mujoco
  params:
    path: datasets/mujoco/hopper_medium-v2.hdf5 
    dt: 0.008                         
    normalize: true

model:
  name: mlp
  params:
    hidden: [256, 256]

integrator:
  name: rk4
  params: {}

trainer:
  name: multi_step
  params:
    k: 5
  
train:
  n_sub: 8
  batch_size: 1024
  epochs: 40
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 5.0
  val_frac: 0.1
  scheduler: step  # step, cosine, or none
  step_scheduler_params: {step_size: 10, gamma: 0.5}
  cosine_scheduler_params: {T_max: 40, eta_min: 0.0}
  distributed: false   # true = multi-GPU DDP; launch with torchrun --nproc_per_node=N (see run.slurm.sh)
  
eval:
  convergence_dt: 0.008
  convergence_n_subs: [1, 2, 4, 8, 16]
  max_samples: 5000
  perturb_action: True


checkpoint: output/vfield_hopper_rk4_3346697.pt
